<!doctype html>
<!--
==========================================================================
  元素の帯 ─ 五本
--------------------------------------------------------------------------
  何をするアプリか
    118 個の元素を原子番号順に一列に並べた「帯」を、左右にスクロールして
    眺めるためのもの。中央のボックスに入っている元素が active atom。

    その上下に、同じ帯のコピーを 4 本置いてある。上 2 本は「1 周期前 /
    2 周期前の同族」、下 2 本は「1 周期後 / 2 周期後の同族」が中央に来る
    ようにずらして追従させる。つまり縦一列を読むと同族が並ぶ。

    周期の長さ（2, 8, 8, 18, 18, 32, 32）が周期ごとに違うので、
    ずらす量も場所によって変わる。結果として上下の帯は中央より速く／
    遅く流れる。これがこのアプリの主題。

  作り
    ライブラリなし。素の HTML + CSS + JavaScript の 1 ファイル。
    ファイルをブラウザで開けばそのまま動く。

  中身の順番
    1. スタイル（見た目）
    2. HTML の骨格
    3. データ：元素名・長周期表での位置
    4. 同族リンクの構築（このアプリの核心）
    5. DOM の組み立て
    6. 電子配置の計算と描画
    7. スクロール位置 → 表示への反映
    8. 入力の処理（ドラッグ・キー・ジャンプ）
==========================================================================
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元素の帯 ─ 五本</title>

<style>
  /* ====================================================================
     1. スタイル
     ==================================================================== */

  :root{
    /* 地の色。方眼紙のような落ち着いた寒色系でまとめている */
    --paper:#e9edf1;   /* 背景 */
    --paper2:#f7f9fa;  /* 帯の下地 */
    --ink:#152029;     /* 文字 */
    --soft:#5b6b78;    /* 補助的な文字 */
    --rule:#c0cbd4;    /* 罫線 */
    --front:#c62b3f;   /* 中央のボックス。ここだけ強い色を使う */

    /* s / p / d / f の濃い色。電子配置図の点に使う */
    --s:#c0392b; --p:#1f6f9c; --d:#b06a12; --f:#6f4a93;

    /* 同じ 4 種のパステル。セルの背景に使う。
       濃い色と対応させてあるので、帯の色と点の色が読み替えられる */
    --s-bg:#f7dcd8; --p-bg:#d8e7f3; --d-bg:#f8e7c9; --f-bg:#e6dcf0;
  }

  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    /* 縦に積んで全体を画面中央に置く。内容が画面より高ければスクロールする */
    display:flex;flex-direction:column;justify-content:center;
    min-height:100vh;padding:18px 0;
    /* 方眼のマス目。28px 間隔の細い線を縦横に重ねている */
    background:
      repeating-linear-gradient(0deg,rgba(120,140,160,.05) 0 1px,transparent 1px 28px),
      repeating-linear-gradient(90deg,rgba(120,140,160,.05) 0 1px,transparent 1px 28px),
      var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-text-size-adjust:100%;
  }

  /* 数字と元素記号用。tabular-nums で桁が揃い、
     スクロール中に数字がガタつかない */
  .num{font-family:"Bahnschrift","DIN Alternate","Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums}

  /* ---- 画面上部：中央の元素の表示 ---- */
  .readout{text-align:center;padding:0 16px 14px}
  .readout .jp{font-size:clamp(16px,4.2vw,21px);font-weight:600;letter-spacing:.02em}
  .readout .meta{margin-top:4px;font-size:12px;color:var(--soft);letter-spacing:.06em}
  .readout .cat{margin-top:5px;font-size:11.5px;color:var(--soft);letter-spacing:.08em}   /* 分類名とブロック。文字だけ */
  .readout .fam{margin-top:6px;font-size:11.5px;color:var(--soft);letter-spacing:.1em}  /* 同族 5 つを並べた行 */
  .readout .fam b{color:var(--ink);font-weight:600}

  /* ---- 帯の置き場所 ---- */
  .stage{position:relative}   /* 中央ボックスを絶対配置するための基準 */

  /* 中央のボックス。5 本すべてを縦に貫くので .stage の子にしてある。
     幅はセル 1 個ぶんで、JS が実測値を入れる（sizePads）。
     pointer-events:none にして、下のセルのクリックを邪魔しないようにする */
  .box{position:absolute;left:50%;top:-7px;bottom:-7px;transform:translateX(-50%);
    border:2px solid var(--front);border-radius:6px;pointer-events:none;z-index:5;
    box-shadow:0 0 0 3px rgba(198,43,63,.09)}

  /* ---- 帯 1 本ぶんの枠 ---- */
  /* overflow:hidden が「窓」の役割。中の .track はこれより横に長く、
     はみ出した部分は見えない */
  .lane{position:relative;overflow:hidden;background:var(--paper2);touch-action:manipulation}
  .lane.mid{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);z-index:3}
  .lane.near{opacity:.74;z-index:2}   /* ±1 周期 */
  .lane.far{opacity:.46;z-index:1}    /* ±2 周期。遠いほど薄くする */
  .lane .tag{  /* 左上の「ひとつ前の同族」などの小さなラベル */
    position:absolute;left:8px;top:3px;z-index:2;font-size:9px;letter-spacing:.14em;color:var(--soft);
    background:var(--paper2);padding:0 4px;pointer-events:none
  }

  /* 上下 4 本の中身。JS が transform:translateX() で位置を決める。
     will-change でブラウザに「ここは動く」と伝えておく */
  .track{display:flex;will-change:transform}

  /* ---- 中央の帯だけはブラウザ本来のスクロール領域にしてある ---- */
  /* こうすると慣性スクロールもスナップも標準機能で済み、自前の物理計算がいらない。
     scroll-snap-type で 1 マスごとにピタッと止まる。
     touch-action:pan-x は横スワイプだけ許可し、ダブルタップ拡大を止める */
  .strip{display:flex;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab}
  .strip::-webkit-scrollbar{display:none}
  /* ドラッグ中とジャンプ中はスナップを切る。
     切らないと、こちらが scrollLeft を書き換えるたびにブラウザが引き戻してしまう */
  .strip.dragging{cursor:grabbing;scroll-snap-type:none}

  /* 帯の両端の余白。これがないと最初の H と最後の Og を中央に持ってこられない。
     幅は「窓の半分 − セルの半分」で、JS が実測して入れる */
  .pad{flex:0 0 auto}

  /* ---- 元素 1 個ぶんのマス ---- */
  .cell{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    position:relative;user-select:none;-webkit-touch-callout:none;border-right:1px solid rgba(255,255,255,.75)}
  .mid  .cell{height:92px;scroll-snap-align:center}  /* このマスの中心でスナップする */
  .near .cell{height:56px}
  .far  .cell{height:44px}
  .cell .z{font-size:10px;color:var(--soft)}
  .cell .sym{font-family:"Bahnschrift","DIN Alternate","Helvetica Neue",sans-serif;font-weight:600;line-height:1}
  .mid  .cell .sym{font-size:24px}
  .near .cell .sym{font-size:17px}
  .far  .cell .sym{font-size:14px}
  .far .cell .z{font-size:9px}

  /* ブロックごとの背景色。data-b 属性は JS が付ける */
  .cell[data-b="s"]{background:var(--s-bg)}
  .cell[data-b="p"]{background:var(--p-bg)}
  .cell[data-b="d"]{background:var(--d-bg)}
  .cell[data-b="f"]{background:var(--f-bg)}
  /* 各帯で中央に来ているマスには .on が付く。
     中央はボックスで囲まれていて分かるので、文字色は変えない */

  /* ---- 電子配置図まわり ---- */
  .config{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:18px 16px 0}
  .config svg{width:172px;height:172px;flex:0 0 auto}
  .conf-text{text-align:left;min-width:150px}
  .conf-text .shells{font-size:13px;color:var(--ink);letter-spacing:.08em;line-height:1.9}
  .conf-text .shells span{margin-right:10px;white-space:nowrap}
  .conf-text .orb{font-size:11.5px;color:var(--soft);letter-spacing:.02em;line-height:1.8;max-width:230px}
  .conf-text .orbnote{margin-top:6px;font-size:10px;color:var(--soft);opacity:.8;letter-spacing:.06em}

  /* ---- 凡例と操作説明 ---- */
  .legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:16px 16px 0;font-size:11px;color:var(--soft);letter-spacing:.08em}
  /* 凡例のスウォッチ。中の塗りがセルの背景色、枠が電子配置図の点の色。
     ひとつの見本で両方を示すことで、帯の色と点の色がつながる */
  .legend i{display:inline-block;width:15px;height:11px;margin-right:6px;vertical-align:-1px;
    border-radius:2px;border:2px solid}
  .hint{text-align:center;font-size:11px;color:var(--soft);padding:8px 16px 0;letter-spacing:.05em;line-height:1.7}

  /* 狭い画面ではマスを小さくする。JS 側は実測値を使うので自動的に追従する */
  @media(max-width:520px){
    .cell{flex-basis:60px}
    .mid .cell{height:82px}.mid .cell .sym{font-size:21px}
    .near .cell{height:50px}.near .cell .sym{font-size:15px}
    .far .cell{height:40px}.far .cell .sym{font-size:13px}
  }
</style>


<!-- ======================================================================
     2. HTML の骨格
     中身の空いている要素は、すべて JS が埋める
     ====================================================================== -->

<!-- 中央の元素の名前・原子番号・同族 5 つ -->
<div class="readout">
  <div class="jp" id="jp">水素</div>
  <div class="meta num" id="meta">1 &nbsp;H</div>
  <div class="cat" id="cat"></div>
  <div class="fam num" id="fam"></div>
</div>

<!-- 帯 5 本。id の -2 / -1 / 1 / 2 は「何周期ずらすか」を表す -->
<div class="stage">
  <div class="box" id="box"></div>
  <div class="lane far"  id="lane-2"><span class="tag">二つ前の同族</span><div class="track"></div></div>
  <div class="lane near" id="lane-1"><span class="tag">ひとつ前の同族</span><div class="track"></div></div>
  <!-- 中央だけ構造が違う：スクロール可能な .strip が入る -->
  <div class="lane mid"><div class="strip" id="strip" tabindex="0" aria-label="原子番号順の元素の帯"></div></div>
  <div class="lane near" id="lane1"><span class="tag">ひとつ後の同族</span><div class="track"></div></div>
  <div class="lane far"  id="lane2"><span class="tag">二つ後の同族</span><div class="track"></div></div>
</div>

<div class="legend">
  <span><i style="background:var(--s-bg);border-color:var(--s)"></i>s</span>
  <span><i style="background:var(--p-bg);border-color:var(--p)"></i>p</span>
  <span><i style="background:var(--d-bg);border-color:var(--d)"></i>d</span>
  <span><i style="background:var(--f-bg);border-color:var(--f)"></i>f</span>
</div>

<!-- 電子配置：左が殻の図、右が K/L/M… の電子数と軌道表記 -->
<div class="config">
  <svg id="bohr" viewBox="0 0 200 200" aria-hidden="true"></svg>
  <div class="conf-text">
    <div class="shells num" id="shells"></div>
    <div class="orb num" id="orb"></div>
    <div class="orbnote">点の色は s・p・d・f の別</div>
  </div>
</div>

<div class="hint">中央の帯をドラッグ／スワイプ・矢印キーで動かすと、上下四本が同族をそろえて追従します。<br>どの帯でも、元素をダブルクリック（長押し）するとそこまで一気に移動します。</div>


<script>
/* ======================================================================
   3. データ
   ====================================================================== */

/* 118 元素を「記号 和名」の形で原子番号順に並べたもの。
   1 本の文字列にしてあるのは、ファイルを短く保つため */
const RAW=`H 水素|He ヘリウム|Li リチウム|Be ベリリウム|B ホウ素|C 炭素|N 窒素|O 酸素|F フッ素|Ne ネオン|Na ナトリウム|Mg マグネシウム|Al アルミニウム|Si ケイ素|P リン|S 硫黄|Cl 塩素|Ar アルゴン|K カリウム|Ca カルシウム|Sc スカンジウム|Ti チタン|V バナジウム|Cr クロム|Mn マンガン|Fe 鉄|Co コバルト|Ni ニッケル|Cu 銅|Zn 亜鉛|Ga ガリウム|Ge ゲルマニウム|As ヒ素|Se セレン|Br 臭素|Kr クリプトン|Rb ルビジウム|Sr ストロンチウム|Y イットリウム|Zr ジルコニウム|Nb ニオブ|Mo モリブデン|Tc テクネチウム|Ru ルテニウム|Rh ロジウム|Pd パラジウム|Ag 銀|Cd カドミウム|In インジウム|Sn スズ|Sb アンチモン|Te テルル|I ヨウ素|Xe キセノン|Cs セシウム|Ba バリウム|La ランタン|Ce セリウム|Pr プラセオジム|Nd ネオジム|Pm プロメチウム|Sm サマリウム|Eu ユウロピウム|Gd ガドリニウム|Tb テルビウム|Dy ジスプロシウム|Ho ホルミウム|Er エルビウム|Tm ツリウム|Yb イッテルビウム|Lu ルテチウム|Hf ハフニウム|Ta タンタル|W タングステン|Re レニウム|Os オスミウム|Ir イリジウム|Pt 白金|Au 金|Hg 水銀|Tl タリウム|Pb 鉛|Bi ビスマス|Po ポロニウム|At アスタチン|Rn ラドン|Fr フランシウム|Ra ラジウム|Ac アクチニウム|Th トリウム|Pa プロトアクチニウム|U ウラン|Np ネプツニウム|Pu プルトニウム|Am アメリシウム|Cm キュリウム|Bk バークリウム|Cf カリホルニウム|Es アインスタイニウム|Fm フェルミウム|Md メンデレビウム|No ノーベリウム|Lr ローレンシウム|Rf ラザホージウム|Db ドブニウム|Sg シーボーギウム|Bh ボーリウム|Hs ハッシウム|Mt マイトネリウム|Ds ダームスタチウム|Rg レントゲニウム|Cn コペルニシウム|Nh ニホニウム|Fl フレロビウム|Mc モスコビウム|Lv リバモリウム|Ts テネシン|Og オガネソン`;

/* { z:原子番号, s:記号, j:和名 } の配列にする。
   配列の添字 i と原子番号 z は i = z - 1 の関係。
   以下、「添字」と言ったら 0 起点、「原子番号」と言ったら 1 起点 */
const EL=RAW.split("|").map((t,i)=>{const k=t.indexOf(" ");return{z:i+1,s:t.slice(0,k),j:t.slice(k+1)};});

/* 長周期表（32 列版）での位置を表す表。
   1 行が [開始原子番号, 終了原子番号, 周期, 開始列]。
   たとえば [21,30,4,17] は「Sc〜Zn は第 4 周期の 17〜26 列」の意味。

   列の割り当ては次のとおり：
     1〜2 列   s ブロック
     3〜16 列  f ブロック（14 列）
     17〜26 列 d ブロック（10 列）
     27〜32 列 p ブロック（6 列）
   f を La〜Yb、d を Lu〜Hg としているので、原子番号が飛ばずに続く */
const SEG=[[1,1,1,1],[2,2,1,32],[3,4,2,1],[5,10,2,27],[11,12,3,1],[13,18,3,27],
 [19,20,4,1],[21,30,4,17],[31,36,4,27],[37,38,5,1],[39,48,5,17],[49,54,5,27],
 [55,56,6,1],[57,70,6,3],[71,80,6,17],[81,86,6,27],
 [87,88,7,1],[89,102,7,3],[103,112,7,17],[113,118,7,27]];

/* SEG を 2 つの索引に展開する
     POS[原子番号] = {p:周期, col:列}      … 位置を引く
     KEY[周期*100 + 列] = 原子番号          … 位置から元素を逆引きする
   周期に 100 を掛けて足すだけの単純なキー。列は最大 32 なので衝突しない */
const POS={},KEY={};
SEG.forEach(([a,b,p,c])=>{
  for(let z=a;z<=b;z++){
    const col=c+(z-a);
    POS[z]={p,col};
    KEY[p*100+col]=z;
  }
});

/* 列番号からブロック（s/p/d/f）を決めて、各元素に持たせる。
   セル下端の帯と、電子配置図の点の色に使う */
EL.forEach(e=>{
  const c=POS[e.z].col;
  e.b = c<=2 ? "s" : c<=16 ? "f" : c<=26 ? "d" : "p";
});

/* ---- 分類（アルカリ金属・貴ガスなど）----
   [表示名, 原子番号の範囲] だけ。色は持たせず、中央の元素の名前の下に
   文字で出すためだけに使う。

   ブロックとは別の切り口である点に注意。たとえばこの分類では
   ランタノイドを La〜Lu（57-71）とするが、ブロックの区切りでは
   f が La〜Yb、Lu は d に入る */
const CATS=[
  ["アルカリ金属",     [[3,3],[11,11],[19,19],[37,37],[55,55],[87,87]]],
  ["アルカリ土類金属", [[4,4],[12,12],[20,20],[38,38],[56,56],[88,88]]],
  ["遷移金属",         [[21,30],[39,48],[72,80],[104,108]]],
  ["ポスト遷移金属",   [[13,13],[31,31],[49,50],[81,85]]],
  ["半金属",           [[5,5],[14,14],[32,33],[51,52]]],
  ["反応性非金属",     [[1,1],[6,9],[15,17],[34,35],[53,53]]],
  ["貴ガス",           [[2,2],[10,10],[18,18],[36,36],[54,54],[86,86]]],
  ["ランタノイド",     [[57,71]]],
  ["アクチノイド",     [[89,103]]],
  ["不明",             [[109,118]]]
];

/* 各元素に分類名を割り当てる */
const CATOF={};
CATS.forEach(([name,ranges])=>{
  ranges.forEach(([a,b])=>{ for(let z=a;z<=b;z++) CATOF[z]=name; });
});
EL.forEach(e=>{ e.cat=CATOF[e.z]; });


/* ======================================================================
   4. 同族リンクの構築 ─ このアプリの核心
   ----------------------------------------------------------------------
   dir 周期ぶん離れた同族の元素を、各元素について求める。
   dir = -1 なら「ひとつ前の同族」、+2 なら「ふたつ後の同族」。

   同族の定義は「同じ列で、周期が dir だけ違う元素」。
   Cl(第3周期27+5列) の +1 なら Br、-1 なら F、というふうに引ける。

   ただし対応する元素がない場所がある。たとえば Sc〜Zn（第4周期の d）は、
   第 3 周期に d ブロックがないので「ひとつ前の同族」が存在しない。
   La〜Yb も同じ。第 2 周期の p ブロックもそう。

   そこで戻り値を 2 本立てにする：
     exact … 実際に存在するときだけ添字、なければ null。
              画面の文字表示（「─」を出すか）と、
              上下の帯のどのマスを強調するかに使う。
     pos   … 帯をどこまでずらすかという連続的な位置。
              null の区間は前後の実在する値から線形補間して埋める。
              こうすると帯が飛ばずになめらかに動く。

   補間の効果が面白いところで、たとえば中央が Sc から Zn へ
   10 マス進むあいだ、「ひとつ前」の帯は Mg と Al のあいだを
   1 マス進むだけになる。ほとんど止まって見える。
   「遷移元素の上には対応する元素がない」ことが、
   帯が動かないという形で目に見える。
   ====================================================================== */
function buildLink(dir){
  /* まず素直に引く。存在しなければ null */
  const raw=EL.map(e=>{
    const {p,col}=POS[e.z];
    const z2=KEY[(p+dir)*100+col];
    return z2 ? z2-1 : null;   // 原子番号 → 添字
  });

  /* null を埋めた版を作る */
  const out=raw.slice(), n=raw.length;
  const known=[];                       // 値が入っている添字の一覧
  raw.forEach((v,i)=>{ if(v!==null) known.push(i); });

  for(let i=0;i<n;i++){
    if(out[i]!==null) continue;         // 埋める必要なし
    const lo=known.filter(k=>k<i).pop();  // 左どなりの実在値
    const hi=known.find(k=>k>i);          // 右どなりの実在値
    if(lo!==undefined && hi!==undefined)
      out[i]=raw[lo]+(raw[hi]-raw[lo])*(i-lo)/(hi-lo);   // 内挿
    else if(lo!==undefined) out[i]=raw[lo]+(i-lo);        // 右端の外挿
    else if(hi!==undefined) out[i]=raw[hi]-(hi-i);        // 左端の外挿
    else out[i]=i;                                        // 全部 null（ここには来ない）
  }
  return {pos:out, exact:raw};
}

/* 上下 4 本ぶんの情報をまとめる。
     dir   … 何周期ずらすか
     link  … buildLink の結果
     track … 動かす DOM 要素
     cur   … いま強調表示しているマスの添字（-1 はなし） */
const LANES=[-2,-1,1,2].map(dir=>{
  const el=document.getElementById("lane"+dir);
  return {dir, link:buildLink(dir), track:el.querySelector(".track"), cur:-1};
});


/* ======================================================================
   5. DOM の組み立て
   ====================================================================== */

const strip=document.getElementById("strip");
const jpEl=document.getElementById("jp"),
      metaEl=document.getElementById("meta"),
      catEl=document.getElementById("cat"),
      famEl=document.getElementById("fam");

/* マス 1 個の中身。原子番号と元素記号だけ */
const cellHTML=e=>`<span class="z num">${e.z}</span><span class="sym">${e.s}</span>`;

/* 中央の帯：[左余白] + 118 マス + [右余白]。
   余白があるおかげで、両端の元素も画面中央まで持ってこられる */
const padL=document.createElement("div"); padL.className="pad";
const padR=document.createElement("div"); padR.className="pad";
strip.appendChild(padL);
EL.forEach(e=>{
  const d=document.createElement("div");
  d.className="cell";
  d.dataset.b=e.b;      // 背景色を決める
  d.dataset.i=e.z-1;    // ジャンプ先を知るための添字
  d.innerHTML=cellHTML(e);
  strip.appendChild(d);
});
strip.appendChild(padR);

/* 上下 4 本：余白なしの 118 マス。位置は transform で決めるので余白はいらない */
LANES.forEach(L=>EL.forEach(e=>{
  const d=document.createElement("div");
  d.className="cell"; d.dataset.b=e.b; d.dataset.i=e.z-1;
  d.innerHTML=cellHTML(e);
  L.track.appendChild(d);
}));


/* ======================================================================
   6. 電子配置
   ====================================================================== */

/* 構成原理（アウフバウ）の順に [軌道, 定員]。この順に電子を詰めていく */
const ORB=[["1s",2],["2s",2],["2p",6],["3s",2],["3p",6],["4s",2],["3d",10],["4p",6],
 ["5s",2],["4d",10],["5p",6],["6s",2],["4f",14],["5d",10],["6p",6],["7s",2],["5f",14],["6d",10],["7p",6]];

/* 表示するときの順（主量子数 → s,p,d,f）。詰める順とは違う。
   たとえば 4s は 3d より先に埋まるが、書くときは 3d のほうが先 */
const ORDER=["1s","2s","2p","3s","3p","3d","4s","4p","4d","4f","5s","5p","5d","5f","6s","6p","6d","7s","7p"];

/* 構成原理どおりにならない元素の補正。実測の基底状態に合わせる。
   [軌道, 増減] の並びで、単純に足し引きする。
   例：Cr(24) は 4s から 1 個減らして 3d に 1 個足す → 3d5 4s1 */
const EXC={
  24:[["4s",-1],["3d",1]],  29:[["4s",-1],["3d",1]],                     // Cr, Cu
  41:[["5s",-1],["4d",1]],  42:[["5s",-1],["4d",1]],                     // Nb, Mo
  44:[["5s",-1],["4d",1]],  45:[["5s",-1],["4d",1]],                     // Ru, Rh
  46:[["5s",-2],["4d",2]],  47:[["5s",-1],["4d",1]],                     // Pd（5s が空）, Ag
  57:[["4f",-1],["5d",1]],  58:[["4f",-1],["5d",1]],  64:[["4f",-1],["5d",1]],  // La, Ce, Gd
  78:[["6s",-1],["5d",1]],  79:[["6s",-1],["5d",1]],                     // Pt, Au
  89:[["5f",-1],["6d",1]],  90:[["5f",-2],["6d",2]],  91:[["5f",-1],["6d",1]],  // Ac, Th, Pa
  92:[["5f",-1],["6d",1]],  93:[["5f",-1],["6d",1]],  96:[["5f",-1],["6d",1]],  // U, Np, Cm
  103:[["6d",-1],["7p",1]]                                               // Lr
};

const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹";                                    // 上付き数字
const sup=n=>String(n).split("").map(c=>SUP[+c]).join("");  // 12 → ¹²
const SHELL="KLMNOPQ";                                      // 主量子数 1〜7 の殻の名前
const OCOL={s:"var(--s)",p:"var(--p)",d:"var(--d)",f:"var(--f)"};  // 点の色

/* 原子番号 z の電子配置を { "1s":2, "2s":2, ... } の形で返す */
function config(z){
  const c={}; ORB.forEach(([k])=>c[k]=0);
  let e=z;                                  // 残りの電子数
  for(const [k,cap] of ORB){
    const t=Math.min(cap,e);                // 定員いっぱいまで入れる
    c[k]=t; e-=t;
    if(e<=0) break;
  }
  (EXC[z]||[]).forEach(([k,d])=>c[k]+=d);   // 例外元素なら補正
  return c;
}

/* 殻の図（SVG）と、右側の文字表示を書き換える */
function drawConfig(z){
  const c=config(z), el=EL[z-1];

  /* 軌道ごとの数を、主量子数（＝殻）ごとにまとめ直す。
     M 殻なら 3s + 3p + 3d を合計する */
  const shells=[];
  for(let n=1;n<=7;n++){
    const subs=ORDER.filter(k=>+k[0]===n && c[k]>0).map(k=>({t:k[1],n:c[k]}));
    const tot=subs.reduce((a,b)=>a+b.n,0);
    if(tot>0) shells.push({n,subs,tot});
  }

  /* SVG を文字列で組み立てる。200×200 の座標系、中心は (100,100) */
  let s="";
  shells.forEach(sh=>{
    const r=14+(sh.n-1)*13;   // 殻の半径。K 殻が 14、以降 13 ずつ外へ
    s+=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--rule)" stroke-width="1"/>`;

    /* その殻の電子を、副殻の順（s→p→d→f）に一列に並べる */
    const dots=[];
    sh.subs.forEach(su=>{ for(let i=0;i<su.n;i++) dots.push(su.t); });

    /* 円周上に等間隔で打つ。真上（-90°）から時計回り */
    dots.forEach((t,i)=>{
      const a=(-90+i*360/dots.length)*Math.PI/180;
      s+=`<circle cx="${(100+r*Math.cos(a)).toFixed(2)}" cy="${(100+r*Math.sin(a)).toFixed(2)}" r="2.6" fill="${OCOL[t]}"/>`;
    });
  });

  /* 原子核。中に元素記号を書く */
  s+=`<circle cx="100" cy="100" r="9.5" fill="var(--ink)"/>`;
  s+=`<text x="100" y="103.4" text-anchor="middle" font-size="9" fill="#fff"
        font-family="Bahnschrift,DIN Alternate,Helvetica Neue,sans-serif" font-weight="600">${el.s}</text>`;
  document.getElementById("bohr").innerHTML=s;

  /* 右側：K 2 / L 8 / M 18 … と、1s² 2s² 2p⁶ …
     軌道の表記は点と同じ色で塗る。「2p⁶ が青 → 青い点が 6 個」と
     たどれるので、色の意味を別に説明しなくて済む */
  document.getElementById("shells").innerHTML=
    shells.map(sh=>`<span>${SHELL[sh.n-1]} ${sh.tot}</span>`).join("");
  document.getElementById("orb").innerHTML=
    ORDER.filter(k=>c[k]>0)
         .map(k=>`<span style="color:${OCOL[k[1]]}">${k+sup(c[k])}</span>`)
         .join(" ");
}


/* ======================================================================
   7. スクロール位置 → 表示への反映
   ====================================================================== */

let cellW=74;   // マス 1 個の幅（px）。CSS で決まるので実測して入れる

/* 画面幅が変わったら呼ぶ。マス幅を測り直し、両端の余白と
   中央ボックスの幅を合わせる */
function sizePads(){
  cellW=strip.querySelector(".cell").offsetWidth;
  const p=(strip.clientWidth-cellW)/2;   // 窓の半分 − マスの半分
  padL.style.width=p+"px";
  padR.style.width=p+"px";
  document.getElementById("box").style.width=cellW+"px";
}

/* 配列 arr を連続関数として扱い、位置 t（小数可）の値を返す。
   マスとマスのあいだにいるときも、上下の帯を中途半端な位置に置ける。
   範囲外は端の傾き 1 でまっすぐ延長する */
function interp(arr,t){
  const i=Math.floor(t), f=t-i;
  if(i<0) return arr[0]+t;
  if(i>=arr.length-1) return arr[arr.length-1]+(t-(arr.length-1));
  return arr[i]+(arr[i+1]-arr[i])*f;
}

/* 強調表示（.on）を付け替える。
   off は「マスの添字 → children の添字」のずれ。
   中央の帯は先頭に余白 div があるので 1、上下の帯は 0 */
function mark(container,idx,prev,off){
  if(prev>=0 && container.children[prev+off]) container.children[prev+off].classList.remove("on");
  if(idx>=0 && idx<EL.length && container.children[idx+off]) container.children[idx+off].classList.add("on");
}

let curMid=-1;   // いま中央にある元素の添字。変化したときだけ重い処理をする

/* スクロールのたびに呼ばれる。ここが表示の中心 */
function update(){
  /* scrollLeft をマス単位に直したものが、そのまま「いま中央にある位置」になる。
     左余白の幅が「窓の半分 − マスの半分」なので、
     scrollLeft = 0 のとき添字 0 のマスがちょうど中央に来る */
  const t=strip.scrollLeft/cellW;
  const half=strip.clientWidth/2;

  /* 上下 4 本を動かす。
     interp で「中央に置きたいマスの位置」を求め、
     そのマスの中心が窓の中央に来るように平行移動する */
  LANES.forEach(L=>{
    const p=interp(L.link.pos,t);
    L.track.style.transform=`translateX(${half-(p+0.5)*cellW}px)`;
  });

  /* ここから下は「どの元素が中央か」が変わったときだけでよい処理 */
  const i=Math.max(0,Math.min(EL.length-1,Math.round(t)));
  if(i!==curMid){
    mark(strip,i,curMid,1);
    curMid=i;
    jpEl.textContent=EL[i].j;
    metaEl.innerHTML=`${EL[i].z} &nbsp;${EL[i].s}`;
    catEl.textContent=`${EL[i].cat} ・ ${EL[i].b} ブロック`;
    drawConfig(EL[i].z);   // 電子配置図を描き直す
  }

  /* 上下の帯で、中央に来ている（＝同族の）マスを強調する。
     対応する元素がなければ -1 で、どのマスも光らない */
  LANES.forEach(L=>{
    const x=L.link.exact[i];
    const n = x===null ? -1 : x;
    if(n!==L.cur){ mark(L.track,n,L.cur,0); L.cur=n; }
  });

  /* 上の表示：Ne ／ Ar ／ Kr のように同族 5 つを並べる */
  const sym=d=>{
    const x=LANES.find(L=>L.dir===d).link.exact[i];
    return x===null ? "─" : EL[x].s;
  };
  famEl.innerHTML=`${sym(-2)} ／ ${sym(-1)} ／ <b>${EL[i].s}</b> ／ ${sym(1)} ／ ${sym(2)}`;
}

/* passive:true で「スクロールを止めることはしない」と宣言しておく。
   ブラウザが待たずにスクロールを進められるので、動きが軽くなる */
strip.addEventListener("scroll",update,{passive:true});


/* ======================================================================
   8. 入力の処理
   ====================================================================== */

/* ---- ドラッグ ----
   タッチのスワイプはブラウザ任せで動くが、
   マウスのドラッグは自前でやる必要がある。
   指／カーソルの移動量ぶん scrollLeft を戻すだけ */
let down=false, x0=0, l0=0;

strip.addEventListener("pointerdown",e=>{
  down=true;
  x0=e.clientX;              // 押した位置
  l0=strip.scrollLeft;       // そのときのスクロール量
  strip.classList.add("dragging");
  /* ポインタを捕捉して、窓の外へカーソルが出てもイベントを受け取り続ける。
     ただしこの副作用で click / dblclick の行き先がこの要素に変わるので、
     ジャンプの判定では dblclick を使わず pointerdown を数えている（後述） */
  strip.setPointerCapture(e.pointerId);
});

strip.addEventListener("pointermove",e=>{
  if(down && !flying) strip.scrollLeft = l0-(e.clientX-x0);
});

function up(){
  if(!down) return;
  down=false;
  if(flying) return;   // ジャンプ中なら何もしない。アニメーションを邪魔しないため
  strip.classList.remove("dragging");
  /* いちばん近いマスに寄せる。scroll-snap も同じことをするが、
     こちらから指示したほうが確実に効く */
  strip.scrollTo({left:Math.round(strip.scrollLeft/cellW)*cellW, behavior:"smooth"});
}
strip.addEventListener("pointerup",up);
strip.addEventListener("pointercancel",up);

/* ---- 矢印キー ---- */
strip.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){ strip.scrollBy({left: cellW, behavior:"smooth"}); e.preventDefault(); }
  if(e.key==="ArrowLeft" ){ strip.scrollBy({left:-cellW, behavior:"smooth"}); e.preventDefault(); }
});

/* ---- 指定した元素まで一気に動かす ----
   scrollTo({behavior:"smooth"}) では速さを決められないので、
   requestAnimationFrame で自前に補間する */
let flying=false, rafJump=null;

function jumpTo(idx){
  idx=Math.max(0,Math.min(EL.length-1,idx));
  const from=strip.scrollLeft, to=idx*cellW, dist=to-from;
  if(Math.abs(dist)<1) return;          // すでにそこにいる

  cancelAnimationFrame(rafJump);        // 前のジャンプが動いていれば止める
  flying=true;
  strip.classList.add("dragging");      // スナップを切る（切らないと引き戻される）

  /* 距離に応じて所要時間を決める。ただし 1 秒弱で頭打ちにする。
     H から Og まで 117 マス飛んでも待たされない */
  const cells=Math.abs(dist)/cellW;
  const dur=Math.min(950, 260+cells*9);
  const t0=performance.now();

  /* ease-in-out（三次）。両端をゆるめて中央で速くする */
  const ease=x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

  const step=now=>{
    const k=Math.min(1,(now-t0)/dur);   // 0 → 1 の進捗
    strip.scrollLeft=from+dist*ease(k);
    if(k<1){
      rafJump=requestAnimationFrame(step);
    }else{
      strip.scrollLeft=to;              // 誤差を残さないよう最後に合わせる
      flying=false;
      strip.classList.remove("dragging");
      update();
    }
  };
  rafJump=requestAnimationFrame(step);
}

/* 帯 1 本にジャンプ操作を割り当てる。
   ダブルクリックと長押しの両方をここで見る。

   dblclick イベントを使っていないのは、中央の帯が setPointerCapture を
   呼んでいるため。捕捉中は click / dblclick の target がマスではなく
   スクロール領域そのものになり、どのマスを叩いたのか分からなくなる。
   そこで pointerdown を 2 回数える方式にした。
   マウスでもタッチでも、5 本すべて同じ経路で動く */
function bindJump(container){
  let tm=null,          // 長押し判定のタイマー
      sx=0, sy=0,       // 押しはじめた座標
      lastIdx=-1,       // 直前に押したマス
      lastT=0;          // その時刻
  const cancel=()=>{ if(tm){ clearTimeout(tm); tm=null; } };

  container.addEventListener("pointerdown",e=>{
    const c=e.target.closest(".cell");
    if(!c || c.dataset.i===undefined) return;   // 余白などを押した
    const idx=+c.dataset.i, now=performance.now();

    /* 同じマスを 430ms 以内にもう一度 → ダブルクリック扱い */
    if(idx===lastIdx && now-lastT<430){
      cancel(); lastIdx=-1; jumpTo(idx); return;
    }
    lastIdx=idx; lastT=now;

    /* 押しっぱなしなら 480ms でジャンプ（長押し） */
    sx=e.clientX; sy=e.clientY;
    tm=setTimeout(()=>{ tm=null; lastIdx=-1; jumpTo(idx); },480);
  });

  /* 8px 以上動いたらスクロールの意思とみなし、長押し判定をやめる */
  container.addEventListener("pointermove",e=>{
    if(tm && (Math.abs(e.clientX-sx)>8 || Math.abs(e.clientY-sy)>8)){ cancel(); lastIdx=-1; }
  });
  container.addEventListener("pointerup",cancel);
  container.addEventListener("pointercancel",()=>{ cancel(); lastIdx=-1; });
  /* スマホで長押しすると出る選択メニューを抑える */
  container.addEventListener("contextmenu",e=>e.preventDefault());
}

bindJump(strip);
LANES.forEach(L=>bindJump(L.track));


/* ======================================================================
   起動
   ====================================================================== */
addEventListener("resize",()=>{ sizePads(); update(); });
sizePads();
update();
</script>
